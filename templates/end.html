<!DOCTYPE html>
<html>

<head>
    <title>Game Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <nav>
        <a href="/">Home</a> |
        <a href="/history">History</a> |
        <a href="/stats">Stats</a> |
        <a href="/logout">Logout</a>
    </nav>

    <br>
    
    <div class="container">

        {% if result.status == "won" %}
            <h1>You Won 🎉</h1>
        {% else %}
            <h1>Game Over 😢</h1>
        {% endif %}

        <p>The number was {{ secret_number }}</p>
        <p>Attempts used: {{ game.attempts }}</p>
        <p>Attempts remaining: {{ game.max_attempts - game.attempts }}</p>

        <h3>Play Again?</h3>

        <div class="buttons">

            <form action="/restart" method="POST">
                <button type="submit">
                    Play again (Same Difficulty)
                </button>
            </form>

            <form action="/" method="GET">
                <button type="submit">
                    Change Difficulty
                </button>
            </form>


            <form action="/exit" method="POST">
                <button type="submit">
                    Exit Game
                </button>
            </form>

        </div>

    </div>

</body>

</html>
